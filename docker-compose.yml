services:
  db:
    image: postgres:18
    container_name: pokemon-team-builder-db
    environment:
      POSTGRES_USER: ptb
      POSTGRES_PASSWORD: ptb
      POSTGRES_DB: ptb
    ports:
      - "5432:5432"
    volumes:
      - ptb-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptb -d ptb"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  ptb-pgdata:
