services:
  db:
    image: postgres:18
    container_name: pokemon-team-builder-db
    environment:
      POSTGRES_USER: ptb
      POSTGRES_PASSWORD: ptb
      POSTGRES_DB: ptb
    ports:
      - "5432:5432"
    volumes:
      - ptb-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptb -d ptb"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  api:
    build: ./backend
    container_name: pokemon-team-builder-api
    profiles: ["container"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://ptb:ptb@db:5432/ptb
      SESSION_SECRET: dev-secret
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    # `fastapi dev` binds 127.0.0.1 by default, unreachable from host when running in container
    command: fastapi dev app/main.py --host 0.0.0.0

volumes:
  ptb-pgdata:
