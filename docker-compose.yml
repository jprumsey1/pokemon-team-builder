services:
  db:
    image: postgres:18
    container_name: db
    environment:
      POSTGRES_USER: ptb
      POSTGRES_PASSWORD: ptb
      POSTGRES_DB: ptb
    ports:
      - "5432:5432"
    volumes:
      - ptb-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptb -d ptb"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  api:
    # Root context: the image's web stage builds the SPA from ./frontend.
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: api
    profiles: ["container"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://ptb:ptb@db:5432/ptb
      SESSION_SECRET: dev-secret
      ADMIN_SECRET: dev-admin-secret
    ports:
      - "8000:8000"

volumes:
  ptb-pgdata:
